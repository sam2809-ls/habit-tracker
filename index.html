<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Road to Ready</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e0457b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Road to Ready">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<div class="wrap">

  <!-- SIGN IN -->
  <section id="auth" class="auth hidden">
    <h1>Our road to ready</h1>
    <p class="muted">Sign in to see you and your partner’s habits, goals and progress in one place.</p>
    <input id="name" placeholder="Your first name (only for new accounts)" autocomplete="given-name">
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <div class="row">
      <button class="btn" id="signin">Sign in</button>
      <button class="btn ghost" id="signup">Create account</button>
    </div>
    <p id="autherr" class="muted" role="alert"></p>
  </section>

  <!-- PAIR -->
  <section id="pair" class="auth hidden">
    <h1>Connect with your partner</h1>
    <p class="muted">One of you creates the shared space. The other joins with the code.</p>
    <button class="btn" id="create">Create our space</button>
    <p class="muted" style="margin:6px 0 0">Already have a code?</p>
    <input id="code" placeholder="Enter code" style="text-transform:uppercase">
    <button class="btn ghost" id="join">Join with code</button>
    <p id="pairerr" class="muted" role="alert"></p>
    <button class="btn ghost small" id="signout2">Sign out</button>
  </section>

  <!-- APP -->
  <main id="app" class="hidden">
    <header>
      <div class="row" style="flex-wrap:nowrap;gap:12px">
        <button class="btn ghost small p25back" id="p25back">← Us</button>
        <div><h1 id="title">Our road to ready</h1><div class="muted" id="today" style="font-size:14px"></div></div>
      </div>
      <div class="row">
        <button class="btn ghost small kitbox" id="kitbtn" aria-label="Visit our kitten"></button>
        <button class="btn ghost small" id="planbtn" aria-label="Planner">📝</button>
        <button class="btn ghost small moodbtn" id="moodbtn" aria-label="Feelings">💭</button>
        <button class="btn ghost small" id="bell" aria-label="Updates">🔔<span id="bellcount"></span></button>
        <div class="menuwrap">
          <button class="btn ghost small" id="menubtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">☰</button>
          <div class="menu hidden" id="menu">
            <span class="muted" id="codeInfo"></span>
            <button id="editname">Edit my name</button>
            <button id="editnick">Nicknames</button>
            <button id="bkup">💾 Back up my data</button>
            <button id="bkrest">Restore from a backup</button>
            <input type="file" id="bkfile" accept=".json,application/json" hidden>
            <div id="sickmenu" style="display:contents"></div>
            <button id="signout">Sign out</button>
          </div>
        </div>
      </div>
    </header>
    <div id="duo" class="duo"></div>

    <nav class="dock" aria-label="Sections">
      <button class="tab dk" data-tab="dash" aria-label="Home"><span class="ic">🏠</span><span class="lb">Home</span></button>
      <button class="tab dk" data-tab="habits" aria-label="Habits"><span class="ic">✅</span><span class="lb">Habits</span></button>
      <button class="tab dk" data-tab="meals" aria-label="Meals"><span class="ic">🍽️</span><span class="lb">Meals</span></button>
      <button class="tab dk" data-tab="sleep" aria-label="Sleep"><span class="ic">🌙</span><span class="lb">Sleep</span></button>
      <button class="tab dk" data-tab="pray" aria-label="Prayers"><span class="ic">🕌</span><span class="lb">Prayers</span></button>
    </nav>

    <button class="edge edge-l" id="railbtn" aria-label="More sections" aria-expanded="false" aria-controls="rail"><span id="railico">›</span></button>
    <div id="railbg" class="railbg hidden"></div>
    <aside id="rail" class="rail" aria-label="More sections">
      <h2>More of us</h2>
      <button class="tab rl" data-tab="goals" style="--t:#e0457b"><span class="ic">🎯</span>Goals</button>
      <button class="tab rl" data-tab="problems" style="--t:#f2b134"><span class="ic">🧩</span>Problems</button>
      <button class="tab rl" data-tab="fun" style="--t:#3b82f6"><span class="ic">🎈</span>Fun together</button>
      <button class="tab rl" data-tab="jar" style="--t:#ff7a90"><span class="ic">💌</span>Love jar</button>
    </aside>

    <button class="edge edge-r hidden" id="qedge" aria-label="Open Quran and duas"><span>📖</span><span class="vt">Quran &amp; duas</span></button>
    <div id="qbg" class="railbg hidden"></div>
    <aside id="v-quran" class="qpanel" aria-label="Quran and duas"></aside>

    <div id="v-p25" class="hidden"></div>
    <div id="v-dash"></div>
    <div id="v-habits" class="hidden"></div>
    <div id="v-goals" class="hidden"></div>
    <div id="v-problems" class="hidden"></div>
    <div id="v-pray" class="hidden"></div>
    <div id="v-meals" class="hidden"></div>
    <div id="v-sleep" class="hidden"></div>
    <div id="v-fun" class="hidden"></div>
    <div id="v-jar" class="hidden"></div>
    <div id="v-study" class="hidden"></div>
  </main>
</div>

<div id="notifmodal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Updates and notifications">
  <div class="card"><div id="notifbody"></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost small" id="notifclose">Done</button></div></div>
</div>
<div id="nickmodal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="nickh">
  <div class="card">
    <h3 id="nickh">Nicknames</h3>
    <p class="muted" id="nickdesc" style="margin:4px 0 8px"></p>
    <div id="nicklist"></div>
    <div class="row" style="margin-top:8px"><input id="nickin" placeholder="Add a nickname" style="flex:1;min-width:160px"><button class="btn small" id="nickadd">Add</button></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost small" id="nickclose">Done</button></div>
  </div>
</div>
<div id="planmodal" class="planapp hidden" role="dialog" aria-modal="true" aria-label="Planner"><div class="planin"><div id="planbody"></div></div></div>
<div id="moodmodal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Feelings"><div class="card"><div id="moodbody"></div></div></div>
<div id="avmodal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Avatar"><div class="card"><div id="avbody" class="avm"></div><div class="row" id="avact" style="justify-content:flex-end;margin-top:14px"></div></div></div>
<div id="kitmodal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Our kitten">
  <div class="card"><div id="v-kitten"></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost small" id="kitclose">Close</button></div></div>
</div>
<script type="module" src="app.js?v=5"></script>
</body>
</html>
